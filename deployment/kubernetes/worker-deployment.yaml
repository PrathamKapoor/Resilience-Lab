apiVersion: apps/v1
kind: Deployment
metadata:
  name: resiliencelab-worker
  labels:
    app: resiliencelab-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resiliencelab-worker
  template:
    metadata:
      labels:
        app: resiliencelab-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: resiliencelab:0.1.0
          command: ["python", "-m", "resiliencelab.controlplane.worker_cli"]
          envFrom:
            - configMapRef:
                name: resiliencelab-config
          env:
            - name: RESILIENCELAB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resiliencelab-secrets
                  key: database-url
            - name: RESILIENCELAB_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: resiliencelab-secrets
                  key: redis-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: resiliencelab-artifacts
