apiVersion: v1
kind: Secret
metadata:
  name: resiliencelab-secrets
type: Opaque
stringData:
  api-keys: replace-with-a-long-random-api-key
  database-url: postgresql+psycopg://resiliencelab:replace-with-a-random-password@postgres:5432/resiliencelab
  redis-url: redis://:replace-with-a-random-password@redis:6379/0
