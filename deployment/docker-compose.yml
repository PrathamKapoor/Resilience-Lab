services:
  api:
    image: resiliencelab:local
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      RESILIENCELAB_STORE: /data/results
      RESILIENCELAB_SERVER_MODE: "true"
      RESILIENCELAB_AUTH_MODE: api_key
      RESILIENCELAB_API_KEYS: ${RESILIENCELAB_API_KEYS:?Set RESILIENCELAB_API_KEYS in .env}
      RESILIENCELAB_DATABASE_URL: ${RESILIENCELAB_DATABASE_URL:?Set RESILIENCELAB_DATABASE_URL in .env}
      RESILIENCELAB_REDIS_URL: redis://redis:6379/0
    volumes:
      - resiliencelab-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: resiliencelab:local
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile
    command: ["python", "-m", "resiliencelab.controlplane.worker_cli"]
    environment:
      RESILIENCELAB_STORE: /data/results
      RESILIENCELAB_SERVER_MODE: "true"
      RESILIENCELAB_DATABASE_URL: ${RESILIENCELAB_DATABASE_URL:?Set RESILIENCELAB_DATABASE_URL in .env}
      RESILIENCELAB_REDIS_URL: redis://redis:6379/0
    volumes:
      - resiliencelab-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resiliencelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-resiliencelab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-resiliencelab}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  resiliencelab-data:
  pgdata:
  redisdata:
