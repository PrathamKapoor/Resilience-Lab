experiment:
  id: RL-BENCH-011
  name: capacity-saturation
  version: 1
  description: Fixed service capacity under high arrival load; queue then reject.

system:
  services:
    - name: payment_service
      processing:
        distribution: constant
        mean: 10ms
      capacity:
        max_concurrency: 5
        queue_limit: 0

workload:
  type: closed_loop
  clients: 50
  arrival_rate: 200
  duration: 20s
  warmup: 2s

failure: []

policy: {}

repetitions:
  count: 5
  seed_strategy: deterministic
  base_seed: 1011