experiment:
  id: exp_demo
  name: retry-jitter-under-burst-failure
  version: 1
  description: Exponential backoff with jitter and circuit breaker under a burst outage.
workload:
  type: closed_loop
  clients: 50
  arrival_rate: 200
  duration: 60s
  warmup: 10s
failure:
  - target: payment_service
    type: http_503
    mode: burst
    probability: 0.3
    duration: 20s
policy:
  retry:
    enabled: true
    max_attempts: 3
  backoff:
    type: exponential
    base: 100ms
    maximum: 5s
    jitter: full
  circuit_breaker:
    enabled: true
    threshold: 10
    recovery_window: 15s
  timeout:
    total: 1s
  concurrency:
    enabled: true
    limit: 50
repetitions:
  count: 5
  seed_strategy: deterministic
  base_seed: 0